<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Camera Test</title>
<style>
body{font-family:Arial,sans-serif;margin:16px;background:#f4f4f4;color:#111}
.card{max-width:700px;margin:auto;background:#fff;border:1px solid #ccc;border-radius:10px;padding:16px}
h1{font-size:22px;margin:0 0 12px}
p{line-height:1.4}
button,label.btn{display:block;width:100%;box-sizing:border-box;padding:15px;margin:12px 0;background:#222;color:#fff;text-align:center;border:0;border-radius:8px;font-size:18px}
input[type=file]{position:absolute;left:-9999px}
#status{padding:12px;background:#eee;border-radius:8px;white-space:pre-wrap;word-break:break-word}
video,img{display:none;width:100%;max-width:100%;margin-top:12px;border:1px solid #aaa;background:#000}
.small{font-size:12px;color:#555;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<h1>Launch CRP919 EV — камера / файл тест</h1>
<p>Нищо не се качва в интернет. Тестът проверява три различни начина за достъп до снимка.</p>

<button id="directCamera">1. Пусни камера директно</button>
<button id="snap" style="display:none">Снимай</button>
<video id="video" autoplay playsinline></video>
<img id="photo" alt="Снимка">

<label class="btn" for="cameraFile">2. Камера през избор на файл</label>
<input id="cameraFile" type="file" accept="image/*" capture="environment">

<label class="btn" for="gallery">3. Избери снимка / файл</label>
<input id="gallery" type="file" accept="image/*">

<div id="status">Готово за тест.</div>
<p class="small"><b>Browser:</b> <span id="ua"></span></p>
</div>

<script>
(function(){
  var status=document.getElementById('status');
  var video=document.getElementById('video');
  var photo=document.getElementById('photo');
  var snap=document.getElementById('snap');
  document.getElementById('ua').textContent=navigator.userAgent || 'няма данни';

  function fileTest(id,label){
    var input=document.getElementById(id);
    input.onchange=function(){
      var f=input.files && input.files[0];
      if(!f){status.textContent=label+': не е избран файл.';return;}
      status.textContent=label+': УСПЕХ\nИме: '+f.name+'\nТип: '+(f.type||'неизвестен')+'\nРазмер: '+Math.round(f.size/1024)+' KB';
      if(window.FileReader){
        var r=new FileReader();
        r.onload=function(e){photo.src=e.target.result;photo.style.display='block';};
        r.onerror=function(){status.textContent += '\nFileReader: грешка.';};
        r.readAsDataURL(f);
      }
    };
  }
  fileTest('cameraFile','Камера през файл');
  fileTest('gallery','Файл');

  document.getElementById('directCamera').onclick=function(){
    status.textContent='Опит за директен достъп до камерата...';
    var gum = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if(!gum){
      status.textContent='НЕ СЕ ПОДДЪРЖА: navigator.mediaDevices.getUserMedia липсва.';
      return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})
      .then(function(stream){
        video.srcObject=stream;
        video.style.display='block';
        snap.style.display='block';
        status.textContent='УСПЕХ: камерата е достъпна директно.';
      })
      .catch(function(err){
        status.textContent='КАМЕРАТА Е БЛОКИРАНА/ОТКАЗАНА:\n'+err.name+': '+err.message;
      });
  };

  snap.onclick=function(){
    if(!video.videoWidth){status.textContent='Камерата още няма картина.';return;}
    var c=document.createElement('canvas');
    c.width=video.videoWidth;c.height=video.videoHeight;
    c.getContext('2d').drawImage(video,0,0);
    photo.src=c.toDataURL('image/jpeg',0.85);
    photo.style.display='block';
    status.textContent='УСПЕХ: снимката е заснета в самата страница.';
  };
})();
</script>
</body>
</html>
